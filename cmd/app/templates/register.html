<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="theme-color" content="#121212">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Events">
	<link rel="manifest" href="/events/static/manifest.json">
	<link rel="apple-touch-icon" href="/events/static/icon-192.svg">
	<link rel="icon" type="image/png" href="/static/favicon.png">
	<title>Events - Register</title>
	<style>
		body {
			background-color: #121212;
			color: #ffffff;
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 20px;
			min-height: 100vh;
			box-sizing: border-box;
		}

		h1 {
			margin-bottom: 20px;
		}

		.container {
			max-width: 400px;
			margin: 0 auto;
			text-align: center;
			padding-top: 50px;
		}

		.form-group {
			margin-bottom: 15px;
			text-align: left;
		}

		label {
			display: block;
			margin-bottom: 5px;
			color: #888;
		}

		input[type="text"],
		input[type="password"] {
			width: 100%;
			padding: 12px;
			border-radius: 5px;
			border: 1px solid #333;
			background-color: #1e1e1e;
			color: #ffffff;
			box-sizing: border-box;
			font-size: 16px;
		}

		input[type="text"]:focus,
		input[type="password"]:focus {
			outline: none;
			border-color: #03dac6;
		}

		button {
			width: 100%;
			padding: 12px 20px;
			background-color: #03dac6;
			color: #000;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 16px;
			font-weight: bold;
			margin-top: 10px;
		}

		button:hover {
			background-color: #00b3a6;
		}

		.login-link {
			margin-top: 20px;
			display: block;
			color: #03dac6;
			text-decoration: none;
		}

		.login-link:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Events</h1>
		<h2>Register</h2>

		<form method="POST" action="/events/register">
			<div class="form-group">
				<label for="username">Username</label>
				<input type="text" id="username" name="username" required autocomplete="username">
			</div>
			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" required autocomplete="new-password">
			</div>
			<button type="submit">Register</button>
		</form>

		<a href="/events/login" class="login-link">Already have an account? Login</a>
	</div>
</body>

</html>
