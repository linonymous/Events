<div class="form-container" id="edit-form">
    <h2>Edit Event</h2>
    <form hx-post="/events/save" hx-swap="outerHTML">
        <input type="hidden" id="event-id" name="id" value="{{.ID}}">
        <input type="hidden" id="user-id" name="user_id" value="{{.UserID}}">
        <input type="hidden" id="list-name" name="list_name" value="{{.ListName}}">
        <input type="text" id="event-title" name="title" placeholder="Event Title" value="{{.Title}}" required>
        <input type="date" id="event-date" name="event_date" value="{{.EventDateStr}}" required>
        <input type="tel" id="mobile-number" name="mobile_number" placeholder="Mobile (e.g., +919876543210)" value="{{.MobileNumber}}" pattern="\+?[0-9]*">
        <select name="recurring" style="padding: 10px; margin: 5px;">
            <option value="true" {{if .Recurring}}selected{{end}}>Yearly (birthday/anniversary)</option>
            <option value="false" {{if not .Recurring}}selected{{end}}>One-time (appointment)</option>
        </select>
        <button type="submit">Save</button>
    </form>
    <div id="response"></div>
</div>
